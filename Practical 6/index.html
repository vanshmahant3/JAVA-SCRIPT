<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 9: Regex & Profile Validator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h2>Practical 9</h2>
        <p class="subtitle"></p>

        <!-- Input Section -->
        <div class="card">
            <h3>Input Text</h3>
            <label for="rawInput">Enter raw text containing student profile details:</label>
            <textarea id="rawInput"
                placeholder="Type or paste text here... (e.g., Student Name: Jane Doe, Roll Number: 2024CS01, Email: jane@gmail.com, Phone: 9876543210, Department: Computer Science)"></textarea>

            <div class="button-group">
                <button class="btn btn-secondary" onclick="loadSample()">Load Sample Text</button>
                <button class="btn btn-primary" onclick="processText()">Process Text</button>
            </div>
        </div>

        <!-- Output Results Section -->
        <div id="resultsSection" class="results-container hidden">
            <!-- 1. Extracted Details & Validations -->
            <div class="card">
                <h3>1. Extracted Info & Validation</h3>
                <div class="detail-row">
                    <span class="detail-label">Student Name:</span>
                    <span class="detail-value" id="outName">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Roll Number:</span>
                    <span class="detail-value" id="outRoll">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Email Address:</span>
                    <span class="detail-value">
                        <span id="outEmail">-</span>
                        <span id="badgeEmail" class="badge">Pending</span>
                    </span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Phone Number:</span>
                    <span class="detail-value">
                        <span id="outPhone">-</span>
                        <span id="badgePhone" class="badge">Pending</span>
                    </span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Department:</span>
                    <span class="detail-value" id="outDept">-</span>
                </div>
            </div>

            <!-- 2. Text Analysis & Counting -->
            <div class="card">
                <h3>2. Text Analysis</h3>
                <div class="detail-row">
                    <span class="detail-label">Total Words:</span>
                    <span class="detail-value" id="outWords">0</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Total Characters (excluding spaces):</span>
                    <span class="detail-value" id="outChars">0</span>
                </div>
            </div>

            <!-- 3. Case Conversion & Replacement -->
            <div class="card">
                <h3>3. Text Transformations</h3>
                <div class="transform-box">
                    <label>Converted to Lowercase:</label>
                    <div class="text-display" id="outLowercase">-</div>
                </div>
                <div class="transform-box">
                    <label>Replaced Department ("Computer Science" → "Information Technology"):</label>
                    <div class="text-display" id="outReplaced">-</div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
