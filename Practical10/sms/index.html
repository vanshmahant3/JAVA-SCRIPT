<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 50px 20px;
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 36px 40px;
        }

        .title {
            text-align: center;
            font-size: 1.85rem;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Form Box */
        .form-box {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 30px;
            background: #ffffff;
        }

        .inputs-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.88rem;
            font-weight: 700;
            color: #334155;
        }

        .input-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #1e293b;
            outline: none;
            transition: all 0.2s ease;
            background: #ffffff;
        }

        .input-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .input-group input::placeholder {
            color: #94a3b8;
        }

        /* Button Row */
        .buttons-row {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 22px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-add {
            background-color: #2563eb;
            color: #ffffff;
        }

        .btn-add:hover {
            background-color: #1d4ed8;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn-load {
            background-color: #475569;
            color: #ffffff;
        }

        .btn-load:hover {
            background-color: #334155;
            box-shadow: 0 4px 12px rgba(71, 85, 105, 0.25);
        }

        .btn-clear {
            background-color: #ef4444;
            color: #ffffff;
        }

        .btn-clear:hover {
            background-color: #dc2626;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        /* Table */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead tr {
            background-color: #f1f5f9;
        }

        th {
            padding: 14px 20px;
            font-size: 0.82rem;
            font-weight: 800;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        td {
            padding: 18px 20px;
            font-size: 0.95rem;
            color: #1e293b;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .id-cell {
            font-weight: 800;
            color: #1e293b;
        }

        .btn-delete {
            background-color: #fee2e2;
            color: #ef4444;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-delete:hover {
            background-color: #ef4444;
            color: #ffffff;
        }

        .empty-row {
            text-align: center;
            color: #64748b;
            padding: 30px;
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            .inputs-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 520px) {
            .inputs-row {
                grid-template-columns: 1fr;
            }
            .buttons-row .btn {
                width: 100%;
            }
            .main-container {
                padding: 24px 16px;
            }
        }
    </style>
</head>
<body>

    <main class="main-container">
        <!-- Header -->
        <h1 class="title">🎓 Student Management System</h1>

        <!-- Form Card -->
        <section class="form-box">
            <form id="studentForm" onsubmit="handleAddStudent(event)">
                <div class="inputs-row">
                    <div class="input-group">
                        <label for="studentId">Student ID</label>
                        <input type="number" id="studentId" placeholder="e.g. 101" required min="1">
                    </div>
                    <div class="input-group">
                        <label for="studentName">Name</label>
                        <input type="text" id="studentName" placeholder="e.g. Rahul Sharma" required>
                    </div>
                    <div class="input-group">
                        <label for="studentDept">Department</label>
                        <input type="text" id="studentDept" placeholder="e.g. CSE" required>
                    </div>
                    <div class="input-group">
                        <label for="studentMarks">Marks</label>
                        <input type="number" id="studentMarks" placeholder="e.g. 85" required min="0" max="100">
                    </div>
                </div>

                <div class="buttons-row">
                    <button type="submit" class="btn btn-add">
                        <span>+</span> Add Student
                    </button>
                    <button type="button" class="btn btn-load" onclick="loadFromStudentsJSON()">
                        📁 Load from students.json
                    </button>
                    <button type="button" class="btn btn-clear" onclick="clearAllData()">
                        🗑️ Clear All
                    </button>
                </div>
            </form>
        </section>

        <!-- Students Table -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>NAME</th>
                        <th>DEPARTMENT</th>
                        <th>MARKS</th>
                        <th>ACTION</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <!-- Dynamic Rows Will Appear Here -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const STORAGE_KEY = "studentRecords";

        // Load data on page load
        document.addEventListener("DOMContentLoaded", () => {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                renderTable(JSON.parse(saved));
            } else {
                // Auto-load default records from students.json on first visit
                loadFromStudentsJSON(false);
            }
        });

        /**
         * Add a new student and store in LocalStorage
         */
        function handleAddStudent(event) {
            event.preventDefault();

            const id = parseInt(document.getElementById("studentId").value.trim());
            const name = document.getElementById("studentName").value.trim();
            const department = document.getElementById("studentDept").value.trim();
            const marks = parseInt(document.getElementById("studentMarks").value.trim());

            if (!id || !name || !department || isNaN(marks)) {
                alert("Please fill in all fields.");
                return;
            }

            let students = getStoredStudents();

            // Check if student with same ID exists
            const existingIndex = students.findIndex(s => Number(s.id) === id);
            if (existingIndex !== -1) {
                students[existingIndex] = { id, name, department, marks };
            } else {
                students.push({ id, name, department, marks });
            }

            // Save to LocalStorage
            saveStudents(students);

            // Re-render table
            renderTable(students);

            // Reset form
            document.getElementById("studentForm").reset();
            document.getElementById("studentId").focus();
        }

        /**
         * Load data from students.json file
         */
        function loadFromStudentsJSON(showAlert = true) {
            fetch("students.json")
                .then(res => {
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    return res.json();
                })
                .then(data => {
                    saveStudents(data);
                    renderTable(data);
                })
                .catch(err => {
                    console.error("Error loading students.json:", err);
                    if (showAlert) {
                        alert("Could not load students.json. Make sure the server is running.");
                    }
                });
        }

        /**
         * Delete a single student
         */
        function deleteStudent(id) {
            let students = getStoredStudents();
            students = students.filter(s => Number(s.id) !== Number(id));
            saveStudents(students);
            renderTable(students);
        }

        /**
         * Clear all stored data
         */
        function clearAllData() {
            if (confirm("Are you sure you want to clear all student records?")) {
                localStorage.removeItem(STORAGE_KEY);
                renderTable([]);
            }
        }

        /**
         * Helper to get data from LocalStorage
         */
        function getStoredStudents() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        /**
         * Helper to save data to LocalStorage
         */
        function saveStudents(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        /**
         * Render table rows
         */
        function renderTable(students) {
            const tbody = document.getElementById("studentTableBody");
            tbody.innerHTML = "";

            if (!students || students.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-row">No student records found. Add a student above or load from students.json.</td>
                    </tr>
                `;
                return;
            }

            students.forEach(student => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="id-cell">#${student.id}</td>
                    <td>${escapeHTML(student.name)}</td>
                    <td>${escapeHTML(student.department)}</td>
                    <td>${student.marks}</td>
                    <td>
                        <button class="btn-delete" onclick="deleteStudent(${student.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function escapeHTML(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
