<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Grade Calculator - Javascript Assignment</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <h1>Student Grade Calculator</h1>
    <p class="intro">Javascript conditional statement case study for evaluating student grades.</p>

    <!-- Calculator Section -->
    <div class="card">
      <h3>Enter Student Marks</h3>
      <form id="studentForm">
        <div class="form-group">
          <label for="name">Student Name:</label>
          <input type="text" id="name" class="form-control" placeholder="Enter full name" required>
        </div>

        <div class="form-group">
          <label for="marks">Marks (0 - 100):</label>
          <input type="number" id="marks" class="form-control" min="0" max="100" placeholder="e.g. 78" required>
        </div>

        <button type="submit" class="btn">Calculate Grade</button>
      </form>

      <!-- Result output -->
      <div class="result-box" id="resultBox">
        <div style="font-weight: bold; color: #555;">Result:</div>
        <div class="result-grade" id="gradeOutput">Grade: B</div>
        <div style="font-size: 13px; color: #666; margin-top: 5px;" id="marksOutput">Marks: 78</div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
